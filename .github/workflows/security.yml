name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed vulnerabilities are caught without a commit.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Scans the default (non-desktop) build — the code path shipped in the CLI.
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        # The excluded rules fire only on patterns already hardened and audited
        # in this repo, so they are noise here (keeping them would make the gate
        # permanently red). All other gosec rules remain active.
        #   G204 - subprocess: argv form only, no shell, `--` separators, HTTPS/ref validation
        #   G301 - MkdirAll 0755: conventional for a per-user CLI's config/skill dirs
        #   G304 - file open from variable: guarded by sanitizeAndRestrictPath + symlink checks
        #   G703 - path taint: same path-sandboxing guards as G304
        #   G306 - WriteFile 0644/0755: intentionally readable scaffolding/example files
        #   G706 - log of skillName: already newline-validated by validateSkillName
        run: gosec -exclude=G204,G301,G304,G306,G703,G706 ./...
