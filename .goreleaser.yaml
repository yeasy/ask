version: 2
project_name: ask

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - 'README'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: ask
    binaries:
      - ask
    repository:
      owner: yeasy
      name: homebrew-tap
    directory: Casks
    homepage: "https://github.com/yeasy/ask"
    description: "Agent Skills Kit - The Package Manager for Agent Skills"
    url:
      verified: "github.com/yeasy/ask/"

nfpms:
  - file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: yeasy
    homepage: "https://github.com/yeasy/ask"
    maintainer: "yeasy <yeasy@github.com>"
    description: "Agent Skills Kit - The Package Manager for Agent Skills"
    license: "MIT"
    formats:
      - deb
      - rpm
    bindir: /usr/bin

release:
  github:
    owner: yeasy
    name: ask
  replace_existing_artifacts: true
